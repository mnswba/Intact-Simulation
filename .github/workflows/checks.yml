name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - run: uv sync --project backend --extra dev --frozen
      - run: uv run --project backend --extra dev --frozen python -m compileall -q backend/intact_backend models
      - run: uv run --project backend --extra dev --frozen python -m pytest backend/tests/test_spec_analysis.py -q
      - run: python3 scripts/check-publication.py
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-plugin-viewer.mjs
