<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Intact Simulation architecture</title><desc id="desc">ChatGPT calls the local MCP tool layer. Isolated CAD and numerical workers return geometry and measured evidence. Audit and verification checks feed versioned projects, exports and the local viewer. The publisher supplies no CAD server.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#4a83a9" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="700" rx="18" fill="#f4f7fb"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="58" font-size="30" font-weight="650" fill="#102f4b">A conversation in ChatGPT. CAD on your computer.</text><text x="44" y="90" font-size="17" fill="#59738a">The skill guides the workflow. MCP connects it to real geometry and numerical tools.</text>
<rect x="298" y="126" width="860" height="518" rx="18" fill="#eaf1f8" stroke="#cadbeb"/><text x="324" y="158" font-size="16" font-weight="650" letter-spacing="2" fill="#17649b">USER'S WINDOWS COMPUTER</text>
<rect x="42" y="223" width="210" height="164" rx="14" fill="#102f4b"/><text x="66" y="264" font-size="24" font-weight="650" fill="#fff">You + ChatGPT</text><text x="66" y="299" font-size="17" fill="#c9dcec">Design intent</text><text x="66" y="327" font-size="17" fill="#c9dcec">Dimensions and context</text><text x="66" y="355" font-size="17" fill="#7ddbd2">Intact skill instructions</text>
<path d="M252 302H333" fill="none" stroke="#4a83a9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="336" y="210" width="220" height="194" rx="12" fill="#fff" stroke="#c7d8e7"/><text x="357" y="246" font-size="23" font-weight="650" fill="#153d5b">Local MCP</text><text x="357" y="276" font-size="16" fill="#17649b">65 tools</text><text x="357" y="313" font-size="17" fill="#526e86">Validate inputs</text><text x="357" y="341" font-size="17" fill="#526e86">Resolve references</text><text x="357" y="369" font-size="17" fill="#526e86">Guard revisions</text>
<path d="M556 302H592" fill="none" stroke="#4a83a9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="596" y="210" width="256" height="194" rx="12" fill="#fff" stroke="#c7d8e7"/><text x="617" y="246" font-size="23" font-weight="650" fill="#153d5b">Isolated workers</text><text x="617" y="285" font-size="17" fill="#526e86">build123d / OpenCASCADE</text><text x="617" y="316" font-size="17" fill="#526e86">FreeCAD sketches / features</text><text x="617" y="347" font-size="17" fill="#526e86">Meshing / bounded solvers</text><text x="617" y="380" font-size="15" fill="#17649b">AppContainer + Job limits</text>
<path d="M852 302H888" fill="none" stroke="#4a83a9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="892" y="210" width="228" height="194" rx="12" fill="#fff" stroke="#c7d8e7"/><text x="912" y="246" font-size="23" font-weight="650" fill="#153d5b">Audit + V&amp;V</text><text x="912" y="285" font-size="17" fill="#526e86">Native solid validity</text><text x="912" y="316" font-size="17" fill="#526e86">Saved design checks</text><text x="912" y="347" font-size="17" fill="#526e86">Accuracy evidence</text><text x="912" y="380" font-size="15" fill="#17649b">Measured results, not guesses</text>
<path d="M1006 405V475" fill="none" stroke="#4a83a9" stroke-width="2" marker-end="url(#arrow)"/><path d="M1006 432H446V406" fill="none" stroke="#c18b4b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="496" y="455" font-size="15" fill="#8a602f">Failed checks return diagnostics; preserve the last valid revision.</text>
<rect x="336" y="479" width="784" height="125" rx="12" fill="#102f4b"/>
<text x="359" y="516" font-size="21" font-weight="650" fill="#fff">Versioned projects</text><text x="359" y="550" font-size="17" fill="#c9dcec">Stable IDs · saved history</text><text x="359" y="578" font-size="17" fill="#c9dcec">Revision-bound evidence</text>
<path d="M608 500V585M850 500V585" stroke="#3f5b73"/>
<text x="630" y="516" font-size="21" font-weight="650" fill="#fff">Engineering files</text><text x="630" y="550" font-size="17" fill="#c9dcec">STEP · STL · GLB · 3MF</text><text x="630" y="578" font-size="17" fill="#c9dcec">Source · project · reports</text>
<text x="873" y="516" font-size="21" font-weight="650" fill="#fff">Local viewer</text><text x="873" y="550" font-size="17" fill="#c9dcec">Inspect · edit · review</text><text x="873" y="578" font-size="17" fill="#c9dcec">Ask AI · iterate</text>
<text x="44" y="674" font-size="16" fill="#526e86">ChatGPT supplies the reasoning. Intact's CAD computation and project storage stay local. No publisher-hosted CAD backend.</text></g>
</svg>
