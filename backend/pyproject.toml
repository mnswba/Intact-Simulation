[project]
name = "intact-simulation-backend"
version = "0.16.0"
description = "ChatGPT CAD tools, validated solids and implicit TPMS lattices for Intact Simulation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "mcp==2.3.0",
]
[project.optional-dependencies]
cad = [
    "build123d==0.13.0",
    "playwright==1.65.0",
    "trimesh>=4.7,<6",
    "scikit-image>=0.25,<1",
    "lxml>=5,<7",
    "manifold3d==3.3.2",
    "gmsh==4.15.0",
    "meshio==5.3.5",
    "scikit-fem==12.0.2",
    "reportlab==4.4.9",
    "python-pptx>=1,<2",
    "ezdxf>=1.4,<2",
    "usd-core>=25,<27",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["intact_backend"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
